<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #312e81;
      --text: #f8fafc;
      --muted: #c7d2fe;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 30% 20%, var(--bg-2), var(--bg-1) 70%);
      overflow: hidden;
    }

    main { text-align: center; position: relative; z-index: 1; }

    h1 {
      font-size: clamp(2.8rem, 11vw, 7.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(90deg, #f472b6, #a78bfa, #60a5fa, #34d399, #f472b6);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite, pop 0.8s cubic-bezier(.2, 1.6, .4, 1) both;
    }

    .wave {
      display: inline-block;
      font-size: clamp(2.5rem, 10vw, 5rem);
      transform-origin: 70% 70%;
      animation: wave 2.4s ease-in-out infinite;
    }

    p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1.1rem;
      opacity: 0;
      animation: fade 1s 0.6s forwards;
    }

    code {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.35);
      color: #4ade80;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: clamp(0.85rem, 3.5vw, 1rem);
      opacity: 0;
      animation: fade 1s 1s forwards;
    }
    code::after {
      content: "▌";
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
    }

    .blob {
      position: fixed;
      width: 40vmax;
      height: 40vmax;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 14s ease-in-out infinite alternate;
    }
    .blob.a { background: #ec4899; top: -15vmax; left: -10vmax; }
    .blob.b { background: #3b82f6; bottom: -15vmax; right: -10vmax; animation-delay: -7s; }

    @keyframes shimmer { to { background-position: 300% 0; } }
    @keyframes pop { from { transform: scale(0.6); opacity: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes float { to { transform: translate(8vmax, 6vmax) scale(1.15); } }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0); }
      10%, 30% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; opacity: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>
  <main>
    <span class="wave">👋</span>
    <h1>Hello, World!</h1>
    <p>Que bom te ver por aqui.</p>
    <code>printf("hello, world\n");</code>
  </main>
</body>
</html>
